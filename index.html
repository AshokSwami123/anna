
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready Book - Register Now</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #190a06;
    color: #ffffff;
    min-height: 100vh;
}

.landing-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
        radial-gradient(ellipse at 15% 20%, #482219 0%, transparent 45%),
        linear-gradient(135deg, #2b120c, #190a06 65%);
}



/* LEFT CONTENT */

.logo {
    font-size: clamp(42px, 6vw, 76px);
    font-weight: 300;
    letter-spacing: -4px;
    color: #e9c54e;
    margin-bottom: 25px;
}

.logo span {
    font-size: 25px;
    letter-spacing: 0;
    vertical-align: middle;
}

.tagline {
    color: #f5e6dd;
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.features {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.feature {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid #513027;
    border-radius: 14px;
    background: rgba(255,255,255,0.025);
    font-size: 15px;
}

.check {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #ff995e, #ff5e68);
    color: #200d08;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: bold;
    flex-shrink: 0;
}

/* RIGHT CARD */

.register-card {
    background: #33251f;
    border: 1px solid #49332b;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
}

.card-content {
    padding: 35px 28px;
}

.card-title {
    font-size: 30px;
    color: #f4cd56;
    margin-bottom: 14px;
}

.card-description {
    color: #d4c2b9;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 25px;
}

/* BUTTONS */

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 54px;
    padding: 15px 20px;
    margin-top: 16px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: 0.3s ease;
    animation: zoomPulse 1.5s infinite ease-in-out;
}

.btn-register {
    color: #190a06;
    background: linear-gradient(100deg, #ff9860, #ff5c67);
}

.btn-download {
    color: #ffffff;
    background: #4caf50;
}

.btn:hover {
    filter: brightness(1.12);
    animation-play-state: paused;
}

@keyframes zoomPulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}

.footer-note {
    font-size: 12px;
    color: #b8a39a;
    margin-top: 22px;
    line-height: 1.6;
}

.card-footer {
    background: #4caf50;
    padding: 17px;
    font-size: 15px;
    font-weight: bold;
}

/* MOBILE RESPONSIVE */

@media (max-width: 768px) {
    .container {
        grid-template-columns: 1fr;
        gap: 30px;
        max-width: 480px;
    }

    .left-content {
        text-align: center;
    }

    .logo {
        margin-bottom: 12px;
    }

    .tagline {
        font-size: 15px;
        margin-bottom: 20px;
    }

    .feature {
        text-align: left;
    }

    .card-content {
        padding: 28px 20px;
    }

    .card-title {
        font-size: 26px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .btn {
        animation: none;
    }
}

.logo img {
	width: 200px;
}
</style>
</head>

<body>

<section class="landing-page">
    <div class="container">

      
        <!-- RIGHT SIDE -->
        <div class="register-card">

            <div class="card-content">

              <div class="logo"><img src="logo.jpg" alt=""></div>

                <h1 class="card-title">Join Ready Book</h1>

                <p class="card-description">
                    Start your journey today.<br>
                    Click below to register or download the app.
                </p>

                <!-- REGISTER BUTTON -->
                <a href="https://sportplay99.win/register?refCode=ADMlYKTvxO"
                   class="btn btn-register">
                    Register Now →
                </a>

               

                <p class="footer-note">
                    Click a button above to continue.
                    Please use the official app or website.
                </p>

            </div>

            <div class="card-footer">
                Welcome to Ready Book
            </div>

        </div>

    </div>
</section>

</body>
</html>
